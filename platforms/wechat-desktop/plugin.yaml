name: wechat-desktop
label: Control Center WeChat Runtime
kind: platform
version: "0.5.28"
description: Internal Hermes gateway adapter managed by Hermes Control Center for Windows WeChat inbound and outbound messaging
author: Neal86
optional_env:
  - name: WECHAT_DESKTOP_POLL_SECONDS
    description: Poll interval for unread WeChat conversations
    password: false
  - name: WECHAT_DESKTOP_GROUP_CHATS
    description: Optional exact group chat names; groups are also learned automatically when WeChat reports a mention of this account
    password: false
  - name: WECHAT_DESKTOP_HOME_CHAT
    description: Exact WeChat conversation used for Cron delivery
    password: false
  - name: WECHAT_DESKTOP_AUTO_ENABLE
    description: Set to 1/true to auto-enable the platform from environment
    password: false
  - name: WECHAT_DESKTOP_ALLOW_ALL_USERS
    description: Allow every WeChat DM sender and every group member who mentions this account; Control Center enables this automatically
    password: false
