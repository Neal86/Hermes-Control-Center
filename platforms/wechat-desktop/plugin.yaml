name: wechat-desktop
label: WeChat Desktop
kind: platform
version: "0.5.4"
description: Native Windows WeChat desktop gateway adapter using UI Automation with fail-closed exact-target verification
author: Neal86
optional_env:
  - name: WECHAT_DESKTOP_POLL_SECONDS
    description: Poll interval for unread WeChat conversations
    password: false
  - name: WECHAT_DESKTOP_ALLOWED_CHATS
    description: Comma-separated exact chat names allowed to enter Hermes; empty allows all detected chats
    password: false
  - name: WECHAT_DESKTOP_GROUP_CHATS
    description: Comma-separated exact WeChat conversation names that should be treated as group chats
    password: false
  - name: WECHAT_DESKTOP_HOME_CHAT
    description: Exact WeChat conversation used for Cron delivery
    password: false
  - name: WECHAT_DESKTOP_AUTO_ENABLE
    description: Set to 1/true to auto-enable the platform from environment
    password: false
