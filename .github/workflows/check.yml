name: Hermes Control Center check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff fastapi pydantic
      - name: Validate Python
        run: |
          python -m compileall -q .
          ruff check .
      - name: Build and validate Dashboard
        run: |
          for file in dashboard/src/api.js dashboard/src/components.js dashboard/src/app.js dashboard/src/index.js; do node --check "$file"; done
          python dashboard/build_bundle.py
          node --check dashboard/dist/index.js
      - name: Run tests
        run: pytest -q tests
      - name: Validate standalone repository surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads((root/'dashboard/manifest.json').read_text('utf-8'))
          assert manifest['version'] == '0.5.11'
          assert manifest['entry'] == 'dist/index.js'
          assert manifest['api'] == 'plugin_api.py'
          assert manifest['icon'] == 'Activity'
          required = [
              'plugin.yaml','install.ps1','doctor.ps1','compatibility.py','tools.py','schemas.py',
              'dashboard/plugin_api.py','dashboard/build_bundle.py','dashboard/src/app.js',
              'management/service.py','management/overview.py','task_center/service_v3.py',
              'providers/service.py','resources/bindings.py','resources/policy.py',
              'wechat/adapter.py','wechat/runtime.py','platforms/wechat-desktop/adapter.py',
              'platforms/wechat-desktop/plugin.yaml'
          ]
          for rel in required:
              assert (root/rel).is_file(), rel
          readme = (root/'README.md').read_text('utf-8')
          assert 'Neal86/Hermes-Control-Center' in readme
          assert not (root/'hermes-extensions').exists()
          PY

  windows-real-hermes:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse PowerShell
        shell: pwsh
        run: |
          foreach ($file in @("Setup-Hermes-Control-Center.ps1", "Setup-Loop-v7.ps1", "install.ps1", "doctor.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Install current Hermes with official Windows installer
        shell: pwsh
        run: |
          $hermesHome = Join-Path $env:RUNNER_TEMP "hermes-control-center-real"
          New-Item -ItemType Directory -Force -Path $hermesHome | Out-Null
          $env:HERMES_HOME = $hermesHome
          "HERMES_HOME=$hermesHome" | Out-File -FilePath $env:GITHUB_ENV -Append

          $installer = Join-Path $env:RUNNER_TEMP "hermes-official-install.ps1"
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.ps1" -OutFile $installer
          & $installer -SkipSetup -HermesHome $hermesHome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bin = Join-Path $hermesHome "hermes-agent\bin"
          $launcher = Join-Path $bin "hermes.exe"
          if (-not (Test-Path $launcher)) { throw "Official Hermes launcher missing: $launcher" }
          "HERMES_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$bin;$env:PATH"
          & $launcher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect real Hermes capabilities
        shell: pwsh
        run: |
          $env:PATH = "$env:HERMES_BIN;$env:PATH"
          hermes --version
          foreach ($command in @("plugins", "profile", "dashboard", "cron", "kanban", "project")) {
            Write-Host "===== hermes $command --help ====="
            & hermes $command --help 2>&1 | Select-Object -First 40 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Hermes command unavailable: $command" }
          }

      - name: Preflight against real Hermes
        shell: pwsh
        run: |
          $env:PATH = "$env:HERMES_BIN;$env:PATH"
          & .\doctor.ps1 -Preflight -Json | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Control Center into real Hermes
        shell: pwsh
        run: |
          $env:PATH = "$env:HERMES_BIN;$env:PATH"
          & .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plugin = Join-Path $env:HERMES_HOME "plugins\hermes-extensions"
          $platform = Join-Path $env:HERMES_HOME "plugins\wechat-desktop"
          foreach ($rel in @(
            "plugin.yaml",
            "dashboard\manifest.json",
            "dashboard\dist\index.js",
            "dashboard\plugin_api.py",
            "dashboard\plugin_api_core.py",
            "dashboard\extra_api.py",
            "management\overview.py",
            "task_center\service_v3.py",
            "providers\service.py",
            "resources\bindings.py",
            "resources\policy.py",
            "wechat\runtime.py"
          )) {
            if (-not (Test-Path (Join-Path $plugin $rel))) { throw "Missing installed file: $rel" }
          }
          if (-not (Test-Path (Join-Path $platform "plugin.yaml"))) { throw "Missing installed WeChat platform" }

      - name: Verify real Hermes plugin discovery and doctor
        shell: pwsh
        run: |
          $env:PATH = "$env:HERMES_BIN;$env:PATH"
          $plugins = & hermes plugins list --plain --no-bundled 2>&1 | Out-String
          $plugins | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($plugins -notmatch "hermes-extensions") { throw "Real Hermes did not discover hermes-extensions" }
          if ($plugins -notmatch "wechat-desktop") { throw "Real Hermes did not discover wechat-desktop" }
          & .\doctor.ps1 -Installed -Json | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test real Hermes Dashboard and plugin mounting
        shell: pwsh
        run: |
          $env:PATH = "$env:HERMES_BIN;$env:PATH"
          $stdout = Join-Path $env:RUNNER_TEMP "hermes-dashboard.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "hermes-dashboard.stderr.log"
          $hermes = (Get-Command hermes -ErrorAction Stop).Source
          $proc = Start-Process -FilePath $hermes -ArgumentList @("dashboard", "--no-open", "--skip-build") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $rootReady = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($proc.HasExited) { break }
              try {
                $root = Invoke-WebRequest -Uri "http://127.0.0.1:9119/" -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 2
                if ($root.StatusCode -eq 200) { $rootReady = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $rootReady) {
              Write-Host "===== dashboard stdout ====="
              if (Test-Path $stdout) { Get-Content $stdout | Select-Object -Last 200 | Out-Host }
              Write-Host "===== dashboard stderr ====="
              if (Test-Path $stderr) { Get-Content $stderr | Select-Object -Last 200 | Out-Host }
              throw "Real Hermes Dashboard root did not become ready on port 9119"
            }

            $manifest = Invoke-WebRequest -Uri "http://127.0.0.1:9119/dashboard-plugins/hermes-extensions/manifest.json" -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 5
            Write-Host "Plugin manifest HTTP: $($manifest.StatusCode)"
            if ($manifest.StatusCode -ne 200) { throw "Dashboard did not serve hermes-extensions manifest" }
            if ($manifest.Content -notmatch '"name"\s*:\s*"hermes-extensions"') { throw "Served plugin manifest was unexpected" }

            foreach ($path in @("capabilities", "management/overview", "providers", "resources", "overview")) {
              $api = Invoke-WebRequest -Uri "http://127.0.0.1:9119/api/plugins/hermes-extensions/$path" -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 5
              Write-Host "Plugin API $path HTTP: $($api.StatusCode)"
              if ($api.StatusCode -eq 404) { throw "Dashboard did not mount API route: $path" }
              if ($api.StatusCode -notin @(200, 401, 403, 409, 500)) { throw "Unexpected plugin API HTTP $($api.StatusCode) for $path" }
            }

            $bundle = Invoke-WebRequest -Uri "http://127.0.0.1:9119/dashboard-plugins/hermes-extensions/dist/index.js" -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 5
            if ($bundle.StatusCode -ne 200 -or $bundle.Content.Length -lt 1000) { throw "Dashboard plugin bundle was not served correctly" }

            $errorLog = Join-Path $env:HERMES_HOME "logs\errors.log"
            if (Test-Path $errorLog) {
              $errors = Get-Content $errorLog -Raw
              $errors | Write-Host
              if ($errors -match "Failed to load plugin.*hermes-extensions|hermes-extensions.*plugin API.*failed|Failed to mount.*hermes-extensions") {
                throw "Hermes logged a backend load/mount failure for hermes-extensions"
              }
            }
          } finally {
            try { & hermes dashboard --stop | Out-Host } catch {}
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
