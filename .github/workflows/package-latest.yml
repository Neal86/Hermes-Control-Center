name: Package latest ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical version metadata
        run: |
          python - <<'PY'
          import json, re, pathlib
          plugin = pathlib.Path('plugin.yaml').read_text(encoding='utf-8')
          m = re.search(r'(?m)^version:\s*["\']?([^\s"\']+)', plugin)
          if not m:
              raise SystemExit('plugin.yaml version missing')
          plugin_version = m.group(1)
          dashboard = json.loads(pathlib.Path('dashboard/manifest.json').read_text(encoding='utf-8'))
          dashboard_version = str(dashboard.get('version', '')).strip()
          if plugin_version != dashboard_version:
              raise SystemExit(f'version mismatch: plugin={plugin_version} dashboard={dashboard_version}')
          print(f'canonical version: {plugin_version}')
          PY
      - name: Build dashboard bundle
        run: python dashboard/build_bundle.py
      - name: Build ZIP from exact commit
        run: |
          OUT="Hermes-Control-Center-main"
          mkdir -p "package/$OUT"
          rsync -a ./ "package/$OUT/" \
            --exclude .git \
            --exclude .github \
            --exclude package \
            --exclude __pycache__ \
            --exclude .pytest_cache
          VERSION=$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path('plugin.yaml').read_text(encoding='utf-8')
          print(re.search(r'(?m)^version:\s*["\']?([^\s"\']+)', text).group(1))
          PY
          )
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$GITHUB_SHA" > "package/$OUT/BUILD_INFO.txt"
          cd package
          zip -qr "Hermes-Control-Center-main.zip" "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-Control-Center-main
          path: package/Hermes-Control-Center-main.zip
          if-no-files-found: error
