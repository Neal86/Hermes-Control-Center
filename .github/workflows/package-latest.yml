name: Package latest ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build dashboard bundle
        run: python dashboard/build_bundle.py
      - name: Build ZIP
        run: |
          OUT="Hermes-Control-Center-main"
          mkdir -p "package/$OUT"
          rsync -a ./ "package/$OUT/" \
            --exclude .git \
            --exclude .github \
            --exclude package \
            --exclude __pycache__ \
            --exclude .pytest_cache
          cd package
          zip -qr "Hermes-Control-Center-main.zip" "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-Control-Center-main
          path: package/Hermes-Control-Center-main.zip
          if-no-files-found: error
