name: Hermes Control Center check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff fastapi pydantic
      - name: Validate Python
        run: |
          python -m compileall -q .
          ruff check .
      - name: Build and validate Dashboard
        run: |
          for file in dashboard/src/api.js dashboard/src/components.js dashboard/src/app.js dashboard/src/index.js; do node --check "$file"; done
          python dashboard/build_bundle.py
          node --check dashboard/dist/index.js
      - name: Run tests
        run: pytest -q tests
      - name: Validate standalone repository surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads((root/'dashboard/manifest.json').read_text('utf-8'))
          assert manifest['version'] == '0.5.1'
          assert manifest['entry'] == 'dist/index.js'
          assert manifest['api'] == 'plugin_api.py'
          assert manifest['icon'] == 'Activity'
          required = [
              'plugin.yaml','install.ps1','doctor.ps1','compatibility.py','tools.py','schemas.py',
              'dashboard/plugin_api.py','dashboard/build_bundle.py','dashboard/src/app.js',
              'management/service.py','management/overview.py','task_center/service_v3.py',
              'wechat/adapter.py','wechat/runtime.py','platforms/wechat-desktop/adapter.py',
              'platforms/wechat-desktop/plugin.yaml'
          ]
          for rel in required:
              assert (root/rel).is_file(), rel
          readme = (root/'README.md').read_text('utf-8')
          assert 'Neal86/Hermes-Control-Center' in readme
          assert not (root/'hermes-extensions').exists()
          PY

  windows-real-hermes:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse PowerShell
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "doctor.ps1")) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Install uv and real Hermes Agent
        shell: pwsh
        run: |
          python -m pip install --upgrade pip uv
          uv --version
          uv tool install "hermes-agent[web]" --python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = (& uv tool dir --bin).Trim()
          if (-not $bin) { throw "uv tool bin directory was empty" }
          "UV_TOOL_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$bin;$env:PATH"
          $hermes = Get-Command hermes -ErrorAction Stop
          Write-Host "Hermes executable: $($hermes.Source)"
          & $hermes.Source --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "uv tool directory: $(& uv tool dir)"

      - name: Create isolated Hermes home and inspect real capabilities
        shell: pwsh
        run: |
          $hermesHome = Join-Path $env:RUNNER_TEMP "hermes-control-center-real"
          New-Item -ItemType Directory -Force -Path $hermesHome | Out-Null
          "HERMES_HOME=$hermesHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:HERMES_HOME = $hermesHome
          $env:PATH = "$env:UV_TOOL_BIN;$env:PATH"
          hermes --version
          foreach ($command in @("plugins", "profile", "dashboard", "cron", "kanban", "project")) {
            Write-Host "===== hermes $command --help ====="
            & hermes $command --help 2>&1 | Select-Object -First 40 | Out-Host
            Write-Host "exit=$LASTEXITCODE"
          }

      - name: Preflight against real Hermes
        shell: pwsh
        run: |
          $env:PATH = "$env:UV_TOOL_BIN;$env:PATH"
          & .\doctor.ps1 -Preflight -Json | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Control Center into real Hermes
        shell: pwsh
        run: |
          $env:PATH = "$env:UV_TOOL_BIN;$env:PATH"
          & .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plugin = Join-Path $env:HERMES_HOME "plugins\hermes-extensions"
          $platform = Join-Path $env:HERMES_HOME "plugins\platforms\wechat-desktop"
          foreach ($rel in @(
            "plugin.yaml",
            "dashboard\dist\index.js",
            "dashboard\plugin_api.py",
            "management\overview.py",
            "task_center\service_v3.py",
            "wechat\runtime.py"
          )) {
            if (-not (Test-Path (Join-Path $plugin $rel))) { throw "Missing installed file: $rel" }
          }
          if (-not (Test-Path (Join-Path $platform "plugin.yaml"))) { throw "Missing installed WeChat platform" }

      - name: Verify real Hermes plugin discovery and doctor
        shell: pwsh
        run: |
          $env:PATH = "$env:UV_TOOL_BIN;$env:PATH"
          $plugins = & hermes plugins list --plain --no-bundled 2>&1 | Out-String
          $plugins | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($plugins -notmatch "hermes-extensions") { throw "Real Hermes did not discover hermes-extensions" }
          if ($plugins -notmatch "wechat-desktop") { throw "Real Hermes did not discover wechat-desktop" }
          & .\doctor.ps1 -Installed -Json | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test real Hermes Dashboard with plugin API
        shell: pwsh
        run: |
          $env:PATH = "$env:UV_TOOL_BIN;$env:PATH"
          $stdout = Join-Path $env:RUNNER_TEMP "hermes-dashboard.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "hermes-dashboard.stderr.log"
          $hermes = (Get-Command hermes -ErrorAction Stop).Source
          $proc = Start-Process -FilePath $hermes -ArgumentList @("dashboard", "--no-open", "--skip-build") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($proc.HasExited) { break }
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:9119/api/plugins/hermes-extensions/capabilities" -TimeoutSec 2
                $response | ConvertTo-Json -Depth 6 | Write-Host
                if ($null -ne $response.capabilities -and $null -ne $response.project_supported) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Write-Host "===== dashboard stdout ====="
              if (Test-Path $stdout) { Get-Content $stdout | Select-Object -Last 200 | Out-Host }
              Write-Host "===== dashboard stderr ====="
              if (Test-Path $stderr) { Get-Content $stderr | Select-Object -Last 200 | Out-Host }
              throw "Real Hermes Dashboard plugin API did not become ready on port 9119"
            }
            $root = Invoke-WebRequest -Uri "http://127.0.0.1:9119/" -UseBasicParsing -TimeoutSec 5
            if ($root.StatusCode -ne 200) { throw "Dashboard root returned HTTP $($root.StatusCode)" }
          } finally {
            try { & hermes dashboard --stop | Out-Host } catch {}
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
